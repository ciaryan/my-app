name: Daily news quiz

on:
  schedule:
    # GitHub runs scheduled workflows hours late (6-8h observed in Oct 2026),
    # so schedule just after midnight UTC to land around breakfast UK time.
    # 00:17 UTC is already the new day in London (01:17 BST / 00:17 GMT).
    - cron: '17 0 * * *'
    # Retries if Google was overloaded earlier. They skip once today's quiz exists.
    - cron: '17 2 * * *'
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-quiz
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A retry run (or a manual one) does nothing if today's quiz already
      # passed validation, so it doesn't spend Gemini quota.
      - name: Check if today's quiz exists
        id: existing
        run: |
          if npm run -s quiz:validate -- --fresh; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      # Each step fails the job on error; today.json is only replaced on
      # success and is only committed if validation passes, so the site keeps
      # serving the previous quiz otherwise.
      - name: Generate quiz
        if: steps.existing.outputs.done != 'true'
        run: npm run quiz:generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # Tried in order if the main model is overloaded or out of quota.
          # Comma-separated; override with a GEMINI_FALLBACK_MODEL repo variable.
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.6-flash,gemini-3.5-flash' }}

      - name: Format quiz
        if: steps.existing.outputs.done != 'true'
        run: npx prettier --write src/data/quiz/today.json

      - name: Validate quiz
        if: steps.existing.outputs.done != 'true'
        run: npm run quiz:validate -- --fresh

      - name: Commit and push
        if: steps.existing.outputs.done != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/quiz/today.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m "News quiz for $(TZ=Europe/London date +%F)"
          git pull --rebase
          git push
